server:
  port: ${PORT:8080}

spring:
  application:
    name: uptime-pulse

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:uptimedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.uptimepulse: INFO
    org.springframework.web: INFO
